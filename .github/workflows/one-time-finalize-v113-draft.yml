name: One-time finalize verified autoABC v1.1.3 DRAFT

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-finalize-v113-draft.yml']

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.head_commit.message == 'ci: finalize verified existing v1.1.3 draft release'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify exact existing draft assets, metadata and SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/459476902" > "$RUNNER_TEMP/autoabc113-draft.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ['RUNNER_TEMP'])/'autoabc113-draft.json'
          release=json.loads(p.read_text())
          expected={
            'autoABC-1.1.3-CHECKONLY.zip':('sha256:ae5c83ef40f3271a71e83b83c675ea8cc87a274735ca06e8ce0af92ae9dc3360',769115),
            'autoABC-1.1.3-install.zip':('sha256:fabd8ff82be72b8ac9815954264f13960112ac38d8759c82445b5545f9376ff2',771070),
            'autoABC-1.1.3-uninstall.zip':('sha256:ab943075d901bb0f5d16cb24078a7528d6a01517d1512563d667ab9019284064',5921),
            'autoABC-1.1.2-v2.3-rescue-uninstall.zip':('sha256:a43db7510e507aee7b8357fa3f7f36d1c14d67d0cd391c928037ce734e7e6b11',5960),
            'SHA256SUMS':('sha256:f13ba6baa9205d10d354119e7f1e883fe30669769c3878798a44838b1534a4c2',386),
          }
          assert release['id']==459476902 and release['tag_name']=='v1.1.3'
          assert release['draft'] is True and release['prerelease'] is False
          assert release['name']=='autoABC 1.1.3'
          actual={a['name']:(a.get('digest'),a['size']) for a in release['assets']}
          assert len(actual)==len(expected)==5 and actual==expected,(actual,expected)
          body=release.get('body') or ''
          assert '2.3.0-beta' in body and 'rescue' in body and 'hardware' in body.lower(),body[:250]
          print('VERIFIED_DRAFT=PASS id=459476902 assets=5 digests_and_sizes=ALL_MATCH')
          print('DRAFT_URL='+release['html_url'])
          PY
      - name: Publish this verified draft without reuploading or modifying assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"draft":false,"prerelease":false,"make_latest":"true"}' > "$RUNNER_TEMP/autoabc113-publish-patch.json"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/459476902" \
            --input "$RUNNER_TEMP/autoabc113-publish-patch.json" > "$RUNNER_TEMP/autoabc113-published.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'autoabc113-published.json').read_text())
          assert j['id']==459476902 and j['tag_name']=='v1.1.3'
          assert j['draft'] is False and j['prerelease'] is False
          assert len(j['assets'])==5
          print('PUBLIC_RELEASE=PASS',j['html_url'])
          PY
      - name: Verify latest release and asset identities unchanged after publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/autoabc113-latest.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.3" > "$RUNNER_TEMP/autoabc113-tag.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])
          b=json.loads((r/'autoabc113-draft.json').read_text())
          l=json.loads((r/'autoabc113-latest.json').read_text())
          t=json.loads((r/'autoabc113-tag.json').read_text())
          assert l['id']==t['id']==b['id']==459476902
          assert l['tag_name']==t['tag_name']=='v1.1.3'
          assert l['draft'] is False and t['draft'] is False and t['prerelease'] is False
          a={x['name']:(x.get('digest'),x['size'],x['id']) for x in b['assets']}
          c={x['name']:(x.get('digest'),x['size'],x['id']) for x in l['assets']}
          assert a==c,(a,c)
          print('LATEST_RELEASE=PASS v1.1.3 assets=5 unchanged SHA256=PASS')
          print(l['html_url'])
          PY
