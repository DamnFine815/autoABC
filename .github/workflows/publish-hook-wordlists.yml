name: One-time - mirror verified autoABC 1.1.2 hook wordlists

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-hook-wordlists.yml']

permissions:
  contents: write

jobs:
  mirror:
    if: >-
      github.event.head_commit.message == 'ci: mirror verified autoABC hook wordlists'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Download verified official install ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/autoabc112"
          gh release download v1.1.2 --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/autoabc112" \
            --pattern autoABC-1.1.2-install.zip
          echo "2913ab8a655c77a1a5b284dfd27409c02af6aa792269a520ed38012632200d9a  $RUNNER_TEMP/autoabc112/autoABC-1.1.2-install.zip" | sha256sum -c -
      - name: Generate source-labeled, byte-verified machine-word listings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          import struct,os,re
          expected={
            "got_hook_base":"f0daa2d6dba9ab06e145a11d661c5fa74eb890096e32b7b0f91373041d8e17c7",
            "got_hook_extended":"b3706b654b6bcf989b629905440fe269e03bd131d3917ac02e389f56f9f01572",
            "psr20_gate":"02c80ab1477c39e3e186ae2e95859b842740a9447a93ce044b8fc6411cc9d09a"
          }
          zfile=Path(os.environ['RUNNER_TEMP'])/'autoabc112'/'autoABC-1.1.2-install.zip'
          root=Path('src/native/reconstructed_hooks')
          root.mkdir(parents=True,exist_ok=True)
          with ZipFile(zfile) as z:
            assert z.testzip() is None
            for stem,sha in expected.items():
              key=f'AutoScript/autoABC/hook/{stem}.bin'
              data=z.read(key)
              assert len(data)==512 and sha256(data).hexdigest()==sha
              lines=[
                f'/* Machine-word transcription of released {key} */',
                '/* THIS IS NOT THE ORIGINAL ASSEMBLY SOURCE. It contains pinned machine code/data. */',
                '    .syntax unified',
                '    .section .text,"ax",%progbits',
                '    .balign 4',
                f'    .global {stem}_blob',
                f'{stem}_blob:',
              ]
              for offset in range(0,512,4):
                value=int.from_bytes(data[offset:offset+4],'little')
                lines.append(f'    .word 0x{value:08x}   /* +0x{offset:03x} */')
              path=root/f'{stem}.S'
              path.write_text('\n'.join(lines)+'\n',encoding='ascii')
              words=[int(x,16) for x in re.findall(r'^\s*\.word 0x([0-9a-f]{8})',path.read_text(),re.M)]
              rebuilt=b''.join(struct.pack('<I',x) for x in words)
              assert rebuilt==data
              print('HOOK_SOURCE_WORDLIST=PASS',stem,sha)
          PY
      - name: Commit verified hook wordlists to repository
        run: |
          set -euo pipefail
          git add src/native/reconstructed_hooks/got_hook_base.S \
                  src/native/reconstructed_hooks/got_hook_extended.S \
                  src/native/reconstructed_hooks/psr20_gate.S
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(native): add SHA-verified ARM hook machine-word transcriptions'
          git push origin HEAD:main
