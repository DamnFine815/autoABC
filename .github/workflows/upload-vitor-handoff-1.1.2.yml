name: One-time attach Vitor native integration handoff to autoABC v1.1.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upload-vitor-handoff-1.1.2.yml

permissions:
  contents: write

jobs:
  attach:
    if: >-
      github.event.head_commit.message == 'ci: attach exact verified Vitor handoff to v1.1.2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect tools and obtain pinned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 --version
          readelf --version | head -n 1
          llvm-objdump --version | head -n 2
          mkdir -p "$RUNNER_TEMP/vitor-source"
          gh release download v1.1.2 \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/vitor-source" \
            --pattern autoABC-1.1.2-install.zip
          echo "2913ab8a655c77a1a5b284dfd27409c02af6aa792269a520ed38012632200d9a  $RUNNER_TEMP/vitor-source/autoABC-1.1.2-install.zip" | sha256sum -c -
      - name: Rebuild and validate byte-exact handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_vitor_handoff_release.py \
            "$RUNNER_TEMP/vitor-source/autoABC-1.1.2-install.zip" \
            . \
            "$RUNNER_TEMP/VITOR_AUTOABC_NATIVE_INTEGRATION_HANDOFF_20261125.zip" \
            --strict-hash
          echo "2213f6aa66d9e7af7cd73d5d655202ce8eb6680ee08fa7687e0f3720a06d3824  $RUNNER_TEMP/VITOR_AUTOABC_NATIVE_INTEGRATION_HANDOFF_20261125.zip" | sha256sum -c -
      - name: Preserve existing release assets and refuse overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.2" > "$RUNNER_TEMP/vitor-release-before.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          release=json.loads((Path(os.environ['RUNNER_TEMP'])/'vitor-release-before.json').read_text())
          assert release['tag_name']=='v1.1.2'
          assert release['prerelease'] is False
          names={x['name'] for x in release['assets']}
          assert names=={'autoABC-1.1.2-CHECKONLY.zip','autoABC-1.1.2-install.zip','autoABC-1.1.2-uninstall.zip','SHA256SUMS'},names
          print('RELEASE_BEFORE=PASS files=4')
          PY
      - name: Attach handoff without replacing any files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v1.1.2 \
            "$RUNNER_TEMP/VITOR_AUTOABC_NATIVE_INTEGRATION_HANDOFF_20261125.zip" \
            --repo "$GITHUB_REPOSITORY"
      - name: Verify published asset is byte-identical and existing assets unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.2" > "$RUNNER_TEMP/vitor-release-after.json"
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          before=json.loads((tmp/'vitor-release-before.json').read_text())
          after=json.loads((tmp/'vitor-release-after.json').read_text())
          assert len(after['assets'])==len(before['assets'])+1
          for x in before['assets']:
            match=[y for y in after['assets'] if y['id']==x['id']]
            assert len(match)==1 and all(match[0][k]==x[k] for k in ('name','digest','size','browser_download_url'))
          fn='VITOR_AUTOABC_NATIVE_INTEGRATION_HANDOFF_20261125.zip'
          asset=next(x for x in after['assets'] if x['name']==fn)
          local=tmp/fn
          digest=hashlib.sha256(local.read_bytes()).hexdigest()
          assert asset['digest']=='sha256:'+digest
          assert digest=='2213f6aa66d9e7af7cd73d5d655202ce8eb6680ee08fa7687e0f3720a06d3824'
          assert asset['size']==local.stat().st_size==215804
          assert not after['prerelease'] and after['tag_name']=='v1.1.2'
          print('PUBLISHED_HANDOFF=PASS',asset['browser_download_url'])
          print('EXISTING_RELEASE_ASSETS=UNCHANGED')
          PY
