name: One-time finalize autoABC v1.1.2 release
on:
  push:
    branches: [release/autoABC-v1.1.2-preview]
    paths: ['.github/workflows/finalize-v1.1.2.yml']
permissions:
  contents: write
jobs:
  finalize:
    if: >-
      github.event.head_commit.message == 'ci: finalize autoABC v1.1.2 as regular release'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout edited 1.1.2 documentation
        uses: actions/checkout@v4
        with:
          ref: release/autoABC-v1.1.2-preview
      - name: Remove preview title and prerelease status without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.2" > "$RUNNER_TEMP/release-before.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          temp=Path(os.environ['RUNNER_TEMP'])
          j=json.loads((temp/'release-before.json').read_text())
          assert j['tag_name']=='v1.1.2'
          assert j['name'] in ['autoABC 1.1.2 (Preview)','autoABC 1.1.2']
          assert len(j['assets'])==4
          names={a['name'] for a in j['assets']}
          assert names=={'autoABC-1.1.2-CHECKONLY.zip','autoABC-1.1.2-install.zip','autoABC-1.1.2-uninstall.zip','SHA256SUMS'}
          body=Path('docs/RELEASE_NOTES_1.1.2.md').read_text()
          assert 'Preview' not in body and 'preview release' not in body.lower()
          payload={'name':'autoABC 1.1.2','prerelease':False,'make_latest':'true','body':body}
          (temp/'release-patch.json').write_text(json.dumps(payload))
          print('RELEASE_PRECHECK=PASS',j['id'])
          PY
          RELEASE_ID=$(python3 -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP']+'/release-before.json'))['id'])")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input "$RUNNER_TEMP/release-patch.json" --silent
      - name: Verify GitHub now advertises stable release 1.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.2" > "$RUNNER_TEMP/release-after.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          root=Path(os.environ['RUNNER_TEMP'])
          before=json.loads((root/'release-before.json').read_text())
          after=json.loads((root/'release-after.json').read_text())
          latest=json.loads((root/'latest.json').read_text())
          assert after['name']=='autoABC 1.1.2'
          assert after['prerelease'] is False and after['draft'] is False
          assert after['tag_name']=='v1.1.2'
          assert after['body'].strip()==Path('docs/RELEASE_NOTES_1.1.2.md').read_text().strip()
          assert latest['tag_name']=='v1.1.2',latest['tag_name']
          fields=('id','name','size','digest','browser_download_url')
          old_assets=sorted([{k:a[k] for k in fields} for a in before['assets']],key=lambda a:a['name'])
          new_assets=sorted([{k:a[k] for k in fields} for a in after['assets']],key=lambda a:a['name'])
          assert old_assets==new_assets,'Unexpected modified release assets'
          print('RELEASE_METADATA=PASS',after['html_url'])
          print('LATEST=PASS',latest['tag_name'])
          print('ASSETS_UNCHANGED=PASS',len(new_assets))
          PY
