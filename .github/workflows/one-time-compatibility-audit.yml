name: One-time inspect oppo-dv-mkv v2.3 compatibility and autoABC 1.1.2 archive

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-compatibility-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    if: github.event.head_commit.message == 'ci: audit oppo-dv-mkv 2.3 wrapper without publishing'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download sealed upstream archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ABC" "$RUNNER_TEMP/DV-21" "$RUNNER_TEMP/DV-22" "$RUNNER_TEMP/DV-23"
          gh release download v1.1.2 --repo DamnFine815/autoABC --dir "$RUNNER_TEMP/ABC" \
            --pattern 'autoABC-1.1.2-*.zip'
          for x in 21 22 23; do
            case $x in
              21) tag=v2.1.2-beta;;
              22) tag=v2.2.0-beta;;
              23) tag=v2.3.0-beta;;
            esac
            gh release download "$tag" --repo fandangos/oppo-dv-mkv --dir "$RUNNER_TEMP/DV-$x" \
              --pattern "oppo-dv-mkv-$tag-full.zip"
          done
          ls -al "$RUNNER_TEMP/ABC" "$RUNNER_TEMP"/DV-*
      - name: Audit original installer and upstream exact binary wrapper identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          import os
          tmp=Path(os.environ["RUNNER_TEMP"])
          h=lambda b:sha256(b).hexdigest()
          base={
            'CHECKONLY':'7d491e447357d43594d1188a3e0701a2a206d6c8339f3c5423cf3af09df44442',
            'install':'2913ab8a655c77a1a5b284dfd27409c02af6aa792269a520ed38012632200d9a',
            'uninstall':'ab1dc00dfd77cd68a8755385853a96032fe76a8d0256a01ae36368ac08d00831',
          }
          for kind,dig in base.items():
            p=tmp/'ABC'/('autoABC-1.1.2-'+kind+'.zip')
            assert p.exists() and h(p.read_bytes())==dig, 'input ZIP mismatch '+kind
            with ZipFile(p) as z:
              assert z.testzip() is None
              print('BASE',kind,'entries',len(z.namelist()),'outer',dig)
              for key in ('AutoScript/autoABC-install.sh','AutoScript/autoABC-uninstall.sh','AutoScript/autoABC-release.id','AutoScript/autoABC-uninstall.id'):
                if key in z.namelist():
                  data=z.read(key)
                  print('SOURCE',kind,key,'sha',h(data),'bytes',len(data))
                  if key.endswith('.sh'):
                    t=data.decode('utf-8')
                    assert "VERSION='1.1.2'" in t
                    print('MARKERS',kind,'1.8.1',t.count('MKV_WRAPPER_181_SHA'), '1.7',t.count('MKV_WRAPPER_170_SHA'))
              assert 'SHA256SUMS_RELEASE' in z.namelist()
          for group,tag in [('21','v2.1.2-beta'),('22','v2.2.0-beta'),('23','v2.3.0-beta')]:
            p=tmp/('DV-'+group)/f'oppo-dv-mkv-{tag}-full.zip'
            with ZipFile(p) as z:
              assert z.testzip() is None
              candidates=[n for n in z.namelist() if n.endswith('/bdpprog') and 'AutoScript/' in n]
              assert len(candidates)==1,candidates
              data=z.read(candidates[0])
              script=data.decode()
              assert script.startswith('#!/bin/sh\n# oppo-dv-mkv boot wrapper')
              assert 'PREV=' in script
              assert '[ -f $PREV ] && PLAYER=$PREV' in script
              assert '$PLAYER "$@"' in script
              print('UPSTREAM',tag,'bytes',len(data),'sha',h(data),'entry',candidates[0])
              print('BUNDLE',tag,'SHA256',h(p.read_bytes()))
          print('AUDIT=PASS wrapper_exec_semantics=retained player_original=not_modified')
          PY
