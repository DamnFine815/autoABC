name: One-time publish autoABC 1.1.2 preview
on:
  push:
    branches: [release/autoABC-v1.1.2-preview]
    paths: ['.github/workflows/publish-v1.1.2-preview.yml']
permissions:
  contents: write
concurrency:
  group: autoabc-v112-preview
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.head_commit.message == 'ci: publish SHA-verified autoABC 1.1.2 preview'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/autoABC-v1.1.2-preview
          fetch-depth: 1
      - name: Fetch pinned 1.1.1 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 1.1.2
          mkdir -p "$RUNNER_TEMP/111"
          gh release download v1.1.1 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/111" --pattern 'autoABC-1.1.1-*.zip'
          test "$(find "$RUNNER_TEMP/111" -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
      - name: Reproduce preverified 1.1.2 assets
        run: |
          set -euo pipefail
          python3 tools/repack_release_1_1_2.py "$RUNNER_TEMP/111" . "$RUNNER_TEMP/112"
          ( cd "$RUNNER_TEMP/112" && sha256sum -c SHA256SUMS )
      - name: Verify wrapper compatibility and shell syntax
        run: |
          set -euo pipefail
          for tag in v1.8.1 v1.9.0 v2.0.0-beta; do
            curl -fLsS --retry 2 "https://raw.githubusercontent.com/fandangos/oppo-dv-mkv/$tag/installer/payload/bdpprog" -o "$RUNNER_TEMP/wrapper"
            echo "54ab24595a1b254e1bf45aa8f9578a4f70d883374e80d13e0a32fc00ad3ea4cd  $RUNNER_TEMP/wrapper" | sha256sum -c -
            echo "UPSTREAM_WRAPPER=PASS $tag"
          done
          python3 - <<'PY'
          import os,subprocess,tempfile
          from zipfile import ZipFile
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'112'
          cnt=0
          for kind,expected in [('CHECKONLY',61),('install',60),('uninstall',4)]:
            with ZipFile(base/f'autoABC-1.1.2-{kind}.zip') as z:
              assert z.testzip() is None
              assert len(z.namelist())==expected
              if kind=='CHECKONLY':
                s=z.read('AutoScript/autoABC-install.sh')
                assert b'CHECKONLY-ONLY BUILD: NO INSTALL' in s
                assert b'mv "$STAGE" "$D"' not in s
              for item in z.namelist():
                data=z.read(item)
                if data.startswith(b'#!/bin/sh'):
                  with tempfile.NamedTemporaryFile() as f:
                    f.write(data);f.flush()
                    subprocess.run(['sh','-n',f.name],check=True)
                    cnt+=1
          assert cnt>=39,cnt
          print('ALL_ZIPS_AND_SHELLS=PASS',cnt)
          PY
      - name: Create preview release with 4 exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.1.2 already exists, refusing overwrite' >&2
            exit 1
          fi
          gh release create v1.1.2 \
            "$RUNNER_TEMP/112/autoABC-1.1.2-CHECKONLY.zip" \
            "$RUNNER_TEMP/112/autoABC-1.1.2-install.zip" \
            "$RUNNER_TEMP/112/autoABC-1.1.2-uninstall.zip" \
            "$RUNNER_TEMP/112/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
            --title 'autoABC 1.1.2 (Preview)' \
            --notes-file docs/RELEASE_NOTES_1.1.2.md \
            --prerelease --latest=false
      - name: Verify live GitHub release integrity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.2" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          data=json.loads((root/'release.json').read_text())
          assert data['tag_name']=='v1.1.2' and data['prerelease'] is True and not data['draft']
          assert len(data['assets'])==4
          for asset in data['assets']:
            p=root/'112'/asset['name']
            assert p.is_file()
            assert p.stat().st_size==asset['size']
            assert asset['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          assert data['body'].strip()==Path('docs/RELEASE_NOTES_1.1.2.md').read_text().strip()
          print('RELEASE_INTEGRITY=PASS',data['html_url'])
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1.2" --jq '.object.sha')" = "$(git rev-parse HEAD)"
          echo TAG_COMMIT=PASS
